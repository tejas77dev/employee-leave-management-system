# Test-only configuration. The application's own properties live in
# src/main/resources and are not overridden here except where a test must differ.

spring.datasource.url=jdbc:h2:mem:library;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# The Flyway migrations are MySQL dialect, so the schema is built from the entity
# mappings for tests instead. See the note on the H2 dependency in pom.xml.
# A new table therefore needs a matching entity: the migration is what MySQL runs,
# the mapping is what these tests run against, and nothing checks they agree.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# The application pins the MySQL dialect for the real database; an in-memory
# test schema needs its own, and the property has to be overridden rather than
# supplemented or Hibernate would still try to speak MySQL to H2.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Every test starts from nothing and the demo data must not appear in the results.
app.seed.enabled=false

spring.jpa.open-in-view=false