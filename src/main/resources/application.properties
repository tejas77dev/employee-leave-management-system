spring.application.name=leave-manager
server.port=8080

# --- MySQL -----------------------------------------------------------------
# No credential is committed here. Set both variables before starting:
#   SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# Defaults suit a local sandbox only; production must supply real values.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/leave_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mysqladmin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Leave dates are calendar dates, not instants. Pinning the JDBC timezone stops
# a server whose clock zone differs from the app's shifting a range by a day.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# The schema is owned by Flyway; Hibernate only validates that it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Flyway ----------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Guards against accidentally dropping a populated database. Toggle to false
# only when deliberately rebuilding a throwaway schema.
spring.flyway.clean-disabled=true

# --- Session ---------------------------------------------------------------
# Persisted in the sessions table, so logins survive a restart.
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=LEAVESESSION

# --- Thymeleaf -------------------------------------------------------------
spring.thymeleaf.cache=true

# --- Demo seed data --------------------------------------------------------
# Demo accounts are created only when the database has no users at all, so this
# can never overwrite real data. Set APP_SEED_ENABLED=false in production.
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.password=${APP_SEED_PASSWORD:password123}

# The AuthenticationProvider bean is wired explicitly in SecurityConfig, which
# is the intended setup; this silences the advisory warning about it.
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
