<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My leave</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/shell :: sidebar}"></aside>

    <div class="app-main">
        <main class="app-main-inner">

            <header class="page-header">
                <div>
                    <p class="eyebrow" th:text="${year}">2026</p>
                    <h1>My leave</h1>
                </div>
                <a class="btn-primary" style="width:auto;margin:0" th:href="@{/requests/new}">Request leave</a>
            </header>

            <section class="grid grid-3" aria-label="Totals">
                <div class="stat">
                    <div class="stat-label">Approved</div>
                    <div class="stat-value" th:text="${fmt.days(approvedDays)} + ' d'">0 d</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Pending</div>
                    <div class="stat-value" th:text="${fmt.days(pendingDays)} + ' d'">0 d</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Rejected</div>
                    <div class="stat-value" th:text="${fmt.days(rejectedDays)} + ' d'">0 d</div>
                </div>
            </section>

            <section class="card">
                <div th:if="${#lists.isEmpty(requests)}" class="empty">You have not requested any leave yet.</div>
                <div th:unless="${#lists.isEmpty(requests)}" class="table-wrap">
                    <table>
                        <thead>
                        <tr>
                            <th>Type</th>
                            <th>Dates</th>
                            <th>Days</th>
                            <th>Status</th>
                            <th>Decided by</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="request : ${requests}" data-testid="request-row">
                            <td th:text="${request.leaveType.name}">Type</td>
                            <td th:text="${fmt.requestRange(request)}">Dates</td>
                            <td class="tnum" th:text="${fmt.days(request.days)}">0</td>
                            <td>
                                <span th:classappend="${fmt.statusClass(request.status)}"
                                      th:text="${fmt.status(request.status)}">Pending</span>
                            </td>
                            <td>
                                <span th:text="${request.reviewedBy != null} ? ${request.reviewedBy.name} : '—'">—</span>
                                <div th:if="${request.reviewNote}" class="note" th:text="${request.reviewNote}"></div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>
</div>
</body>
</html>
