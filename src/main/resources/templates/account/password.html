<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change password</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/shell :: sidebar}"></aside>

    <div class="app-main">
        <main class="app-main-inner">

            <header class="page-header">
                <h1>Change password</h1>
            </header>

            <div th:if="${error}" class="alert-error" data-testid="form-error" role="alert" th:text="${error}"></div>
            <!-- Only set after a real change, so reloading the form does not
                 claim the password was updated. -->
            <div th:if="${success}" class="alert-success" role="status">Your password has been updated.</div>

            <section class="card" style="max-width:520px">
                <form th:action="@{/account/password}" method="post">
                    <label class="label" for="currentPassword">Current password</label>
                    <input class="field" type="password" id="currentPassword" name="currentPassword"
                           autocomplete="current-password" required>
                    <div th:if="${fieldErrors != null and fieldErrors.containsKey('currentPassword')}"
                         class="field-error" th:text="${fieldErrors.get('currentPassword')}"></div>

                    <label class="label" for="newPassword">New password</label>
                    <input class="field" type="password" id="newPassword" name="newPassword"
                           autocomplete="new-password" minlength="8" required>
                    <div th:if="${fieldErrors != null and fieldErrors.containsKey('newPassword')}"
                         class="field-error" th:text="${fieldErrors.get('newPassword')}"></div>

                    <label class="label" for="confirmPassword">Confirm new password</label>
                    <input class="field" type="password" id="confirmPassword" name="confirmPassword"
                           autocomplete="new-password" minlength="8" required>
                    <div th:if="${fieldErrors != null and fieldErrors.containsKey('confirmPassword')}"
                         class="field-error" th:text="${fieldErrors.get('confirmPassword')}"></div>

                    <button class="btn-primary" type="submit">Update password</button>
                </form>
            </section>

            <p><a th:href="@{/dashboard}">Back to the dashboard</a></p>

        </main>
    </div>
</div>
</body>
</html>
