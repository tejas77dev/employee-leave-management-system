<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leave types</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/shell :: sidebar}"></aside>

    <div class="app-main">
        <main class="app-main-inner">

            <header class="page-header">
                <h1>Leave types</h1>
            </header>

            <div th:if="${param.error}" class="alert-error" data-testid="form-error" role="alert"
                 th:text="${param.error}"></div>

            <section class="card">
                <details>
                    <summary><strong>New leave type</strong></summary>
                    <form th:action="@{/admin/leave-types/save}" method="post" style="margin-top:14px;max-width:420px">
                        <input type="hidden" name="id" value="">

                        <label class="label" for="ct-name">Name</label>
                        <input class="field" type="text" id="ct-name" name="name" maxlength="60" required>

                        <label class="label" for="ct-description">Description</label>
                        <input class="field" type="text" id="ct-description" name="description" maxlength="200">

                        <label class="label" for="ct-default">Default days</label>
                        <input class="field" type="number" id="ct-default" name="defaultDays" step="0.5" min="0" value="15" required>

                        <div class="checkbox-row">
                            <input type="checkbox" id="ct-active" name="active" value="true" checked>
                            <label for="ct-active">Active</label>
                        </div>

                        <button class="btn-primary" type="submit">Create leave type</button>
                    </form>
                </details>
            </section>

            <section th:if="${#lists.isEmpty(leaveTypes)}" class="card">
                <div class="empty">No leave types configured yet.</div>
            </section>

            <section th:unless="${#lists.isEmpty(leaveTypes)}" class="stack">
                <div th:each="leaveType : ${leaveTypes}" class="card" style="margin:0" data-testid="leave-type-card">
                    <form th:action="@{/admin/leave-types/save}" method="post">
                        <input type="hidden" name="id" th:value="${leaveType.id}">

                        <label class="label" for="lt-name-${leaveType.id}">Name</label>
                        <input class="field" type="text" id="lt-name-${leaveType.id}" name="name" maxlength="60"
                               th:value="${leaveType.name}" required>

                        <label class="label" for="lt-description-${leaveType.id}">Description</label>
                        <input class="field" type="text" id="lt-description-${leaveType.id}" name="description"
                               maxlength="200" th:value="${leaveType.description}">

                        <label class="label" for="lt-default-${leaveType.id}">Default days</label>
                        <input class="field" type="number" id="lt-default-${leaveType.id}" name="defaultDays"
                               step="0.5" min="0" th:value="${leaveType.defaultDays}" required>
                        <p class="hint">Changing this re-syncs balances that have no days used or reserved.</p>

                        <div class="checkbox-row">
                            <input type="checkbox" id="lt-active-${leaveType.id}" name="active" value="true"
                                   th:checked="${leaveType.active}">
                            <label for="lt-active-${leaveType.id}">Active</label>
                        </div>

                        <button class="btn-secondary btn-sm" type="submit">Save</button>
                    </form>
                </div>
            </section>

        </main>
    </div>
</div>
</body>
</html>
