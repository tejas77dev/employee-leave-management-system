<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request leave</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/shell :: sidebar}"></aside>

    <div class="app-main">
        <main class="app-main-inner">

            <header class="page-header">
                <h1>Request leave</h1>
            </header>

            <div th:if="${error}" class="alert-error" data-testid="form-error" role="alert" th:text="${error}"></div>

            <section class="card" style="max-width:560px">
                <form th:action="@{/requests/new}" method="post">

                    <label class="label" for="leaveTypeId">Leave type</label>
                    <select class="field" id="leaveTypeId" name="leaveTypeId">
                        <option value="">Choose a leave type</option>
                        <option th:each="balance : ${balances}"
                                th:value="${balance.leaveType.id}"
                                th:text="${balance.leaveType.name} + ' (' + ${fmt.days(balance.remaining())} + ' left)'"
                                th:selected="${form != null and form.leaveTypeId == balance.leaveType.id}">Type</option>
                    </select>
                    <div th:if="${fieldErrors != null and fieldErrors.containsKey('leaveTypeId')}"
                         class="field-error" th:text="${fieldErrors.get('leaveTypeId')}"></div>

                    <div class="checkbox-row">
                        <input type="checkbox" id="isHalfDay" name="isHalfDay" value="true"
                               th:checked="${form != null and form.isHalfDay}">
                        <label for="isHalfDay">This is a half-day</label>
                    </div>

                    <label class="label" for="startDate">From</label>
                    <input class="field" type="date" id="startDate" name="startDate"
                           th:value="${form != null} ? ${form.startDate} : ''">
                    <div th:if="${fieldErrors != null and fieldErrors.containsKey('startDate')}"
                         class="field-error" th:text="${fieldErrors.get('startDate')}"></div>

                    <label class="label" for="endDate">To</label>
                    <input class="field" type="date" id="endDate" name="endDate"
                           th:value="${form != null} ? ${form.endDate} : ''">
                    <div th:if="${fieldErrors != null and fieldErrors.containsKey('endDate')}"
                         class="field-error" th:text="${fieldErrors.get('endDate')}"></div>

                    <!-- A half-day covers one date, so the end date is forced
                         to match the start. The field stays visible but is
                         read-only in half-day mode, and the script copies the
                         start across, so the value is still submitted. -->
                    <div id="half-day-fields" hidden>
                        <label class="label" for="partOfDay">Which half?</label>
                        <select class="field" id="partOfDay" name="partOfDay">
                            <option value="">Choose morning or afternoon</option>
                            <option value="MORNING" th:selected="${form != null and form.partOfDay == 'MORNING'}">Morning (first half)</option>
                            <option value="AFTERNOON" th:selected="${form != null and form.partOfDay == 'AFTERNOON'}">Afternoon (second half)</option>
                        </select>
                        <div th:if="${fieldErrors != null and fieldErrors.containsKey('partOfDay')}"
                             class="field-error" th:text="${fieldErrors.get('partOfDay')}"></div>
                    </div>

                    <p class="hint" id="days-preview" role="status"></p>

                    <label class="label" for="reason">Reason (optional)</label>
                    <textarea class="field" id="reason" name="reason" maxlength="500" rows="3"
                              th:text="${form != null} ? ${form.reason} : ''"></textarea>
                    <div th:if="${fieldErrors != null and fieldErrors.containsKey('reason')}"
                         class="field-error" th:text="${fieldErrors.get('reason')}"></div>

                    <button class="btn-primary" type="submit">Submit request</button>
                </form>
            </section>

        </main>
    </div>
</div>

<!-- Shows what the request will cost, recomputed as the dates change. The
     rule matches the server exactly, so the figure is never a surprise. -->
<script th:inline="javascript">
    (function () {
    var form = document.getElementById('leaveTypeId').closest('form');
    var start = document.getElementById('startDate');
    var end = document.getElementById('endDate');
    var half = document.getElementById('isHalfDay');
    var preview = document.getElementById('days-preview');
    var halfFields = document.getElementById('half-day-fields');

    function isWeekend(value) {
        var day = value.getUTCDay();
        return day === 0 || day === 6;
    }

    function calculate() {
        if (half.checked) {
            return {days: '0.5'};
        }
        var from = start.value, to = end.value;
        if (!from || !to || to < from) {
            return null;
        }
        var cursor = new Date(from + 'T00:00:00Z');
        var last = new Date(to + 'T00:00:00Z');
        var count = 0;
        while (cursor <= last) {
            if (!isWeekend(cursor)) {
                count += 1;
            }
            cursor = new Date(cursor.getTime() + 86400000);
        }
        return {days: String(count)};
    }

    function refresh() {
        // A half-day is one date, so the half picker replaces the end date.
        // The field is made read-only rather than disabled: a disabled input
        // is not submitted, and the server still needs endDate to validate.
        halfFields.hidden = !half.checked;
        end.readOnly = half.checked;
        if (half.checked) {
            end.value = start.value;
        }

        var result = calculate();
        if (result === null) {
            preview.textContent = 'Enter a valid date range.';
            preview.className = 'hint';
            return;
        }
        if (result.days === '0') {
            preview.textContent = 'That range contains no working days.';
            preview.className = 'field-error';
            return;
        }
        preview.textContent = 'This will use ' + result.days + ' day(s) of your balance.';
        preview.className = 'hint';
    }

    [start, half].forEach(function (element) {
        element.addEventListener('change', refresh);
    });
    end.addEventListener('change', refresh);
    refresh();
    })();
</script>
</body>
</html>
